# general settings
name: VAESR
exp_name: np_rd_nm_p1_5
model_type: ReconstructionModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# generate settings
settings:
  factor: 16
  is_intp: true # false: upsample (LR size)
  is_krig: true # true
  is_random: false # true / false
  slide_window: 0
  train_prop: 1.5 # 7500 // train_prop
  test_prop: 15
  rec_path: ../recordings_60cells_Neuropixels-128_30.0_10.0uV.h5
  save_path: ../generate_traces_for_train_norm/np
  chl_path: ../bad_chls/np
  norm_path: ../zscore_info/np
  weights_path: /root/autodl-tmp/weights/factor_16/vaesr_np128_rd_nm_p1_5.pth
  is_whole: True # pattern: whole (True) / partial (False)
  recon_method: vaesr
  base_loss_path: loss_dict
  channel_num: 128

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_Reconstruction
    sigma_type: random
    sigma_range: [0,50]
    in_ch: 1    ## Grayscale image
    dataroot_gt: ../generate_traces_for_train_norm/np/generate_krig_traces_factor_16/train
    dataroot_lq: none
    geometric_augs: False
    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 1
    batch_size_per_gpu: 8 # 每个gpu的batch size

    ### ------- Training on single fixed-patch size 128x128---------
    mini_batch_sizes: [8]
    iters: [300000]
    gt_size: 128
    gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: True

  val:
    name: ValSet
    type: Dataset_Reconstruction
    sigma_test: 25
    in_ch: 1  ## Grayscale image
    dataroot_gt: ../generate_traces_for_train_norm/np/generate_krig_traces_factor_16/test
    dataroot_lq: none
    io_backend:
      type: disk

# network structures
network_g:
  type: VAESR
  num_channels: 1
  width: 64
  depth: 8
  kernel_size: 3
  latent_dim: 32
  beta: 1.0

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # KL divergence weight for VAE
  kl_weight: 0.2

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]

  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: MSELoss # L1Loss
    loss_weight: 1
    reduction: mean

  # ========== Anti-Catastrophic Forgetting Strategies ==========
  l2_sp_weight: 0.0
  layer_lr_decay: 1.0
  ewc_lambda: 0.0
  kd_weight: 0.0
  kd_feature_weight: 0.0
  kd_temperature: 4.0

  early_stop:
    enabled: true
    metric: MSELoss
    mode: min
    patience: 6
    min_delta: 0.0000001

# validation settings
val:
  window_size: 8
  val_freq: !!float 1e3
  save_img: false
  rgb2bgr: false
  use_image: false
  max_minibatch: 8

  metrics:
    mse:
      type: calculate_mse

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500