# general settings
name: SpkRes
exp_name: single_sq_rd_nm
model_type: ReconstructionModel
scale: 1
num_gpu: 1
manual_seed: 100

# generate settings
settings:
  factor: 2
  is_intp: true
  is_krig: true
  is_random: false
  slide_window: 0
  train_prop: 1.5
  test_prop: 15
  rec_path: ../recordings_50cells_SqMEA-10-15_30.0_10.0uV.h5
  save_path: ../generate_traces_for_train/sq_nm
  chl_path: ../bad_chls/sq
  norm_path: ../zscore_info/sq
  weights_path: /root/autodl-tmp/Spk-Res/weights_spkres/factor_2/fs_sq100_rd_nm_p1_5.pth
  is_whole: True
  recon_method: spkres
  base_loss_path: loss_dict
  channel_num: 128

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_Reconstruction
    sigma_type: random
    sigma_range: [0,50]
    in_ch: 1
    dataroot_gt: ../generate_traces_for_train/sq_nm/generate_krig_traces_factor_2/train
    dataroot_lq: none
    geometric_augs: False
    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1

    ### ------- Training on single fixed-patch size 128x128---------
    mini_batch_sizes: [8]
    iters: [300000]
    gt_size: 128
    gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: True

  val:
    name: ValSet
    type: Dataset_Reconstruction
    sigma_test: 25
    in_ch: 1
    dataroot_gt: ../generate_traces_for_train/sq_nm/generate_krig_traces_factor_2/test
    dataroot_lq: none
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: BiasFree
  dual_pixel_task: False

# path
path:
  pretrain_network_g: /root/autodl-tmp/Spk-Res/weights_spkres/factor_2/single_np128_rd_nm.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]

  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: MSELoss
    loss_weight: 1
    reduction: mean

  early_stop:
    enabled: true
    metric: MSELoss
    mode: min
    patience: 6
    min_delta: 0.00001

# validation settings
val:
  window_size: 8
  val_freq: !!float 2e3
  save_img: false
  rgb2bgr: false
  use_image: false
  max_minibatch: 8

  metrics:
    mse:
      type: calculate_mse

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500